config_version = 2

[sync]
# "private" creates files as 0600 and directories as 0700.
# Use "umask" only when synchronized data must follow the process umask.
permissions = "private"
# Root for account- and Drive-specific synchronized data directories.
# Paths may be absolute or relative to the service working directory.
directory = "/home/USER/OneDrive"
drive_id = "me"
# Optional selective-sync rules. Relative paths resolve from this TOML file.
# sync_list = "sync_list"
dry_run = true

[transfer]
# Connection and per-request transfer limits for file content.
# Supported values: "default", "size_asc", "size_dsc", "name_asc", and "name_dsc".
order = "default"
connect_timeout_seconds = 30
operation_timeout_seconds = 3600
# Abort transfers below this rate for this many seconds. Set timeout to 0 to disable.
stall_timeout_seconds = 60
stall_minimum_bytes_per_second = 1
# Supported values: "auto", "1.1", and "2".
http_version = "auto"
# Supported values: "auto", "4", and "6".
ip_version = "auto"

[download]
concurrency = 4
# Maximum retries for transient file-content download failures.
maximum_retries = 4
# Files larger than this value are downloaded in HTTP Range chunks of this size.
chunk_threshold_bytes = 8388608
# Flush and record resumable download progress after this many new bytes.
checkpoint_interval_bytes = 1048576
# Zero disables the receive-rate limit.
maximum_rate_bytes_per_second = 0
# "relaxed" accepts SharePoint/AIP/HEIC content whose downloaded size or hash
# differs from Graph metadata. This weakens integrity guarantees.
validation = "strict"

[state]
directory = "/home/USER/.local/state/onedrive-cpp"

[auth]
application_id = ""
tenant_id = "common"
endpoint = "https://login.microsoftonline.com"
scopes = [
  # Identify the signed-in user and read basic profile information.
  "User.Read",
  # Read and write files in the signed-in user's OneDrive.
  "Files.ReadWrite",
  # Optional for organizational accounts: access every file the user can access,
  # including shared files and document libraries.
  # "Files.ReadWrite.All",
  # Optional for organizational SharePoint sites; personal accounts do not
  # support this scope.
  # "Sites.ReadWrite.All",
  # Request a refresh token so the client can stay signed in.
  "offline_access",
]

[graph]
# Microsoft Graph endpoint for the global Microsoft 365 cloud.
endpoint = "https://graph.microsoft.com/v1.0"
# For Microsoft 365 operated by 21Vianet in China, use:
# endpoint = "https://microsoftgraph.chinacloudapi.cn/v1.0"
# Also set auth.endpoint to "https://login.chinacloudapi.cn".

[graph.throttle]
maximum_retries = 4
initial_delay_seconds = 1
maximum_delay_seconds = 300

[filesystem]
metadata = "auto"
