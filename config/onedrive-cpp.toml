config_version = 2

[console]
# Supported values: "auto", "always", and "never".
color = "auto"
# Sync and monitor interface: "auto", "console", or "tui".
ui = "auto"
# TUI colors: "hacker", "ocean", "amber", or "synthwave".
theme = "hacker"

[logging]
# Supported values: "trace", "debug", "info", "warn", "error", "critical",
# and "off".
level = "info"
# Optional rotating log file. Relative paths resolve from this TOML file.
# The parent directory must already exist, be owned by the current user, and
# not be writable by other users. Log files are restricted to mode 0600.
# file = "onedrive-cpp.log"

[auth]
application_id = ""
tenant_id = "common"
endpoint = "https://login.microsoftonline.com"
scopes = [
  # Identify the signed-in user and read basic profile information.
  "User.Read",
  # Read and write files in the signed-in user's OneDrive.
  "Files.ReadWrite",
  # Optional for organizational accounts: access every file the user can access,
  # including shared files and document libraries.
  # "Files.ReadWrite.All",
  # Optional for organizational SharePoint sites; personal accounts do not
  # support this scope.
  # "Sites.Read.All",
  # Required instead when SharePoint document libraries will be synchronized.
  # "Sites.ReadWrite.All",
  # Request a refresh token so the client can stay signed in.
  "offline_access",
]

[graph]
# Microsoft Graph endpoint for the global Microsoft 365 cloud.
endpoint = "https://graph.microsoft.com/v1.0"
# For Microsoft 365 operated by 21Vianet in China, use:
# endpoint = "https://microsoftgraph.chinacloudapi.cn/v1.0"
# Also set auth.endpoint to "https://login.chinacloudapi.cn".

[graph.throttle]
maximum_retries = 4
initial_delay_seconds = 1
maximum_delay_seconds = 300

# Optional proxy for authentication, Graph API, and file transfers.
# By default this table is absent, so libcurl may still use HTTP_PROXY,
# HTTPS_PROXY, ALL_PROXY, and their lowercase variants from the environment.
# To guarantee direct connections, omit this table and unset those variables.
# Supported schemes: "http", "https", "socks4", "socks4a", "socks5", "socks5h".
# Use "socks5h" when the proxy should resolve destination host names.
# [proxy]
# url = "socks5h://127.0.0.1:1080"
# By default this is unset and libcurl uses NO_PROXY/no_proxy from the environment.
# Set an empty array to override the environment and proxy every destination.
# no_proxy = ["localhost", "127.0.0.1", ".internal.example.com"]
# No proxy credentials are configured by default.
# username = "proxy-user"
# password_file = "/run/secrets/onedrive-proxy-password"
# Defaults to "auto". Other values: "basic", "digest", "ntlm", and "negotiate".
# auth = "auto"
# Unset by default, so HTTPS proxies use the system CA trust store.
# ca_file = "/etc/ssl/certs/company-proxy-ca.pem"

[sync]
# "private" creates files as 0600 and directories as 0700.
# Use "umask" only when synchronized data must follow the process umask.
permissions = "private"
# "block" refuses local/remote conflicts. "backup" first preserves a
# conflicting local regular file as a same-directory *.safeBackup-* copy.
local_conflict = "block"
# Root for account- and Drive-specific synchronized data directories.
# Paths may be absolute or relative to the service working directory.
data_directory = "/home/USER/OneDrive"
# Optional mounted ancestor of data_directory. Sync and single-file download
# stop before local scanning or recovery when this path is not mounted.
# Monitor checks it at startup and before every synchronization; a runtime
# mount loss blocks that round while Monitor remains available to retry later.
# data_mount_point = "/mnt/data"
drive_id = "me"
# Optional selective-sync rules. Relative paths resolve from this TOML file.
# sync_list = "sync_list"
# Include ordinary files located directly in the Drive root when sync_list is set.
sync_root_files = false
# Exclude a directory subtree when it contains a regular .nosync marker file.
nosync_enabled = true
# Supported values: "include" and "exclude".
dotfiles = "include"
# Skip larger files in both upload and download directions. Zero is unlimited.
maximum_file_size_bytes = 0
# "bidirectional" downloads remote changes and uploads local changes.
# "upload_only" uploads local changes without changing local content from Graph.
# "download_only" applies remote changes without uploading local changes.
mode = "bidirectional"
# "propagate" mirrors source deletions to the destination. "preserve" never
# deletes the destination because an item disappeared from the source.
delete_policy = "propagate"
# Stop before propagating a larger local disappearance to OneDrive.
# A deleted parent counts every tracked descendant it would remove.
maximum_remote_deletions = 1000
dry_run = true

[transfer]
# Connection and per-request transfer limits for file content.
# Supported values: "default", "size_asc", "size_dsc", "name_asc", and "name_dsc".
order = "default"
connect_timeout_seconds = 30
operation_timeout_seconds = 3600
# Abort transfers below this rate for this many seconds. Set timeout to 0 to disable.
stall_timeout_seconds = 60
stall_minimum_bytes_per_second = 1
# Supported values: "auto", "1.1", and "2".
http_version = "auto"
# Supported values: "auto", "4", and "6".
ip_version = "auto"

[download]
concurrency = 4
# Maximum retries for transient file-content download failures.
maximum_retries = 4
# Files larger than this value are downloaded in HTTP Range chunks of this size.
chunk_threshold_bytes = 8388608
# Flush and record resumable download progress after this many new bytes.
checkpoint_interval_bytes = 1048576
# Zero disables the receive-rate limit.
maximum_rate_bytes_per_second = 0
# Shared limit across all concurrent downloads. Zero disables the total limit.
maximum_total_rate_bytes_per_second = 0
# "relaxed" accepts SharePoint/AIP/HEIC content whose downloaded size or hash
# differs from Graph metadata. This weakens integrity guarantees.
validation = "strict"

[upload]
# Maximum number of independent files uploaded concurrently.
concurrency = 1
# Files through 250 MB (250,000,000 bytes) use a simple upload. Larger files
# use an upload session with the fragment size below.
# Non-final upload-session fragments must be a multiple of 320 KiB and less
# than 60 MiB.
chunk_size_bytes = 10485760
# Zero disables the per-request send-rate limit.
maximum_rate_bytes_per_second = 0
# Shared ceiling across all concurrent uploads. Zero disables the total limit.
maximum_total_rate_bytes_per_second = 0

[monitor]
# Disable WebSocket notifications to use local events plus Graph polling only.
websocket_enabled = true
# Timeout for acquiring or renewing the Graph notification channel.
websocket_request_timeout_seconds = 60
# Timeout for the WSS handshake.
websocket_connect_timeout_seconds = 10
# Renew the notification URL this many seconds before its expiry.
websocket_renewal_lead_seconds = 120
# Bounded exponential retry interval for channel and WSS failures.
websocket_initial_backoff_seconds = 1
websocket_maximum_backoff_seconds = 300
# WebSocket notifications trigger low-latency Delta synchronization. Poll Graph
# after this many quiet seconds as the authoritative missed-notification fallback.
poll_interval_seconds = 300
# Coalesce bursts of local events for this long before synchronizing.
settle_delay_milliseconds = 1000

[filesystem]
# "auto" probes user extended attributes and falls back to the SQLite journal.
# "xattr" requires extended-attribute support; "database" disables xattrs.
metadata = "auto"

[state]
directory = "/home/USER/.local/state/onedrive-cpp"
